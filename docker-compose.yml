name: 5squarefeed
# Pinned explicitly so the named volume below always resolves to
# "5squarefeed_postgres_data" regardless of what the containing folder
# is called. Without this, Docker Compose derives the project name
# from the parent folder name -- renaming the folder would make
# Compose look for a differently-prefixed volume, find none, and
# silently create a fresh empty one (data loss, not an error).
# Renamed from "5min-ai-news" -> "5squarefeed" once the real brand/
# domain existed (see CLAUDE.md) -- migrated via a full pg_dump/
# pg_restore, not a raw volume rename, so nothing was lost; the old
# "5min-ai-news_postgres_data" volume and a .db-backups/ dump file are
# both kept as a safety net until the new one's been live a while.
# Note: the production/public brand name is "5squareFeed" -- see
# README.md. This is just the dev/repo-level project name.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_news}
      POSTGRES_USER: ${POSTGRES_USER:-ai_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_news_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_news -d ai_news"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # Mount the entire project for local development.
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fires the Daily News Cycle's scheduled jobs (see
  # app/worker/celery_app.py's beat_schedule and project.md's "Daily
  # Execution Architecture") -- collection passes at 10 PM/1 AM/3:30 AM
  # IST, then the 4 AM IST cutoff (rank -> produce -> QA). A separate
  # process from `worker`: beat only decides *when* a task should run
  # and enqueues it; `worker` is what actually executes it. Running
  # beat more than once would enqueue every scheduled task multiple
  # times, so this must stay a single replica.
  #
  # Real scheduling is a production concern -- during dev/testing we
  # don't want the nightly jobs firing unprompted just because the
  # stack happens to be up at those IST times. The "scheduler" profile
  # keeps this out of a plain `docker compose up -d`; start it
  # deliberately with either:
  #   docker compose --profile scheduler up -d   (everything, beat included)
  #   docker compose up -d beat                  (just beat -- naming a
  #                                                service explicitly
  #                                                starts it regardless
  #                                                of active profiles)
  beat:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: