<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5squareFeed — Editorial Dashboard</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0c101c">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="/dashboard/"><span class="bar"></span>5squareFeed</a>
  <span class="topbar-sub">Editorial Dashboard</span>
</header>

<main id="app">
  <p class="loading">Loading…</p>
</main>

<div id="edit-overlay" class="overlay" hidden>
  <div class="edit-panel">
    <div class="edit-panel-header">
      <h2 id="edit-title">Edit story</h2>
    </div>
    <div class="edit-panel-body">
      <div class="edit-source-block">
        <span class="edit-source-label">Source article</span>
        <div id="edit-source"></div>
        <dl id="edit-meta" class="edit-meta"></dl>
      </div>
      <label>Headline
        <input id="edit-headline" type="text">
      </label>
      <label>Summary
        <textarea id="edit-summary" rows="3"></textarea>
      </label>
      <label>Script text (spoken narration)
        <textarea id="edit-script" rows="5"></textarea>
      </label>
      <p class="edit-note">Saving resets this story's audio/visual/video — re-run <code>Produce</code> on the episode to regenerate them from the edited script.</p>
      <div id="edit-preview"></div>
    </div>
    <div class="edit-panel-footer">
      <span id="edit-status" class="edit-status"></span>
      <div class="edit-panel-footer-actions">
        <button id="edit-save" class="btn btn-primary" type="button">Save</button>
        <button id="edit-close" class="btn btn-ghost" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
